server:
  port: 8888

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: book-service-books
          uri: ${BOOK_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/books/**

        - id: book-service-users
          uri: ${BOOK_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/users/**

        - id: book-service-orders
          uri: ${BOOK_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/orders/**

        - id: book-service-logs
          uri: ${BOOK_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/logs/**

        - id: book-service-auth
          uri: ${BOOK_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/auth/**
